    let currentStep = 0;
    let currentDocument = null;

    function renderStep() {
      const app = document.getElementById("app");
      app.innerHTML = "";

      if (currentStep === 0) {
        // Menu wyboru dokumentu
        const stepDiv = document.createElement("div");
        stepDiv.className = "step";

        const title = document.createElement("h3");
        title.textContent = "Wybierz dokument do sprawdzenia";
        stepDiv.appendChild(title);

        baseDocuments.forEach(doc => {
          const button = document.createElement("button");
          button.textContent = doc.name;
          button.onclick = () => showFields(doc);
          stepDiv.appendChild(button);
        });

        app.appendChild(stepDiv);
      }

      if (currentStep === 1) {
        // Wyświetlenie szczegółów wybranego dokumentu
        const stepDiv = document.createElement("div");
        stepDiv.className = "step";
        
        const title = document.createElement("h3");
        title.textContent = `Sprawdź elementy dokumentu: ${currentDocument.name}`;
        stepDiv.appendChild(title);

        const checkboxGroup = document.createElement("div");
        checkboxGroup.className = "checkbox-group";

        // Dodajemy wspólne pola dla każdego dokumentu
        currentDocument.commonFields && currentDocument.commonFields.forEach(field => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = field;
          checkbox.style.marginRight = "8px";
          label.appendChild(checkbox);
          label.append(field);
          checkboxGroup.appendChild(label);
          checkboxGroup.appendChild(document.createElement("br"));
        });

        // Dodajemy specyficzne pola dla danego typu dokumentu
        currentDocument.specificFields && currentDocument.specificFields.forEach(field => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = field;
          checkbox.style.marginRight = "8px";
          label.appendChild(checkbox);
          label.append(field);
          checkboxGroup.appendChild(label);
          checkboxGroup.appendChild(document.createElement("br"));
        });

        stepDiv.appendChild(checkboxGroup);

        const nextBtn = document.createElement("button");
        nextBtn.textContent = "Dalej";
        nextBtn.onclick = () => {
          currentStep = 0;  // Powrót do menu wyboru dokumentu
          renderStep();
        };

        stepDiv.appendChild(nextBtn);
        app.appendChild(stepDiv);
      }

      if (currentStep === 2) {
        // Zakończenie sprawdzania operatu
        app.innerHTML = "<h2>Sprawdzanie operatu zostało zakończone ✅</h2>";
      }
    }

    function showFields(doc) {
      currentStep = 1;  // Zaczynamy sprawdzanie wybranego dokumentu
      currentDocument = doc;
      renderStep();
    }

    renderStep();  // Uruchomienie aplikacji
  </script>
